[build]
  publish = "."
  command = "node build.js"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/admin-stock"
  to = "/admin-stock.html"
  status = 200

[[redirects]]
  from = "/admin-login"
  to = "/admin-login.html"
  status = 200

[[redirects]]
